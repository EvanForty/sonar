<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sonar: scan the depths, detect the signal, launch the coin</title>
<meta name="description" content="Sonar is a Solana launchpad of autonomous sonar station NFTs that detect narratives, launch coins on pump.fun and turn every detection into a tradable Signal NFT.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="theme-color" content="#03264B">
<meta property="og:title" content="Sonar: scan the depths, detect the signal, launch the coin">
<meta property="og:description" content="A Solana launchpad of autonomous sonar stations that detect narratives, launch coins on pump.fun and turn every detection into a tradable Signal NFT.">
<meta property="og:image" content="/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@solana/web3.js@1.95.3/lib/index.iife.min.js"></script>
<style>
:root{
  --bg:#EAF1F8;--panel:#FFFFFF;--ink:#05284F;--soft:#2E4D76;--mute:#5F7DA3;--rule:#D2DEEC;--hull:#05284F;--edge:#05284F;--frame:#05284F;
  --cy:#00B7DA;--cy-ink:#007A99;--grid:rgba(5,40,79,.05);--stripe:rgba(5,40,79,.04);
  --f-head:'Chakra Petch','Arial Narrow',sans-serif;
  --f-ui:'Hanken Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#03264B;--panel:#08305C;--ink:#FFFFFF;--soft:#C3D5EC;--mute:#86A3C8;--rule:#1D4C81;--hull:#FFFFFF;--edge:#FFFFFF;--frame:#2D5E97;
    --cy:#14DDF7;--cy-ink:#4BE7FA;--grid:rgba(255,255,255,.035);--stripe:rgba(255,255,255,.045);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#03264B;--panel:#08305C;--ink:#FFFFFF;--soft:#C3D5EC;--mute:#86A3C8;--rule:#1D4C81;--hull:#FFFFFF;--edge:#FFFFFF;--frame:#2D5E97;
  --cy:#14DDF7;--cy-ink:#4BE7FA;--grid:rgba(255,255,255,.035);--stripe:rgba(255,255,255,.045);color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--bg);color:var(--ink);font:400 15.5px/1.55 var(--f-ui);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px dashed var(--cy-ink);outline-offset:3px}
.wrap{max-width:1420px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1.5px solid var(--frame)}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0;padding:13px 18px;border-bottom:1px solid var(--rule);font:600 12px/1.2 var(--f-mono);letter-spacing:.07em;text-transform:uppercase}
.ph small{font-weight:400;color:var(--mute);letter-spacing:.04em}
.ph .pix,.ph .mini{height:18px;width:auto}
.ph .end{margin-left:auto}
.pad{padding:18px}
.tag{display:inline-block;font:600 11px/1 var(--f-mono);letter-spacing:.05em;padding:5px 7px;background:var(--ink);color:var(--bg);text-transform:uppercase}
.tag.cy{background:var(--cy);color:#032447}
.tag.ghost{background:transparent;color:var(--soft);border:1px solid var(--rule)}
.pix rect{fill:var(--hull)} .pix .c{fill:var(--cy)}
.hull{fill:var(--hull)} .cyf{fill:var(--cy)} .idle{fill:var(--mute)} .m{fill:var(--mute)} .rulef{fill:var(--rule)}
.small{font-size:13px;color:var(--soft)}
.warn{color:#B42318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .warn{color:#FF9B8C}}
:root[data-theme="dark"] .warn{color:#FF9B8C}

/* header */
.top{margin-bottom:16px}
.nav{display:grid;grid-template-columns:auto 1fr auto}
.brand{display:flex;align-items:center;gap:12px;padding:10px 20px;border-right:1px solid var(--rule);text-decoration:none}
.brand .mini{height:40px;width:70px;flex:none}
.brand b{display:block;font:700 30px/.9 var(--f-head);letter-spacing:.04em;text-transform:uppercase}
.brand small{display:block;margin-top:6px;font:500 11px/1 var(--f-mono);color:var(--mute);letter-spacing:.05em}
.tabs{display:grid;grid-template-columns:repeat(8,minmax(90px,1fr));overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:15px 8px 12px;border-right:1px solid var(--rule);text-decoration:none;color:var(--soft);font:500 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tabs a em{position:absolute;top:7px;right:8px;font-style:normal;color:var(--mute);font-size:10px}
.tabs a .pix{height:22px;width:auto} .tabs a .mini{height:22px;width:38px}
.tabs a:hover{background:var(--stripe)}
.tabs a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -4px 0 var(--cy)}
.walletcell{position:relative;display:flex;align-items:center;padding:12px 18px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font:700 14px/1 var(--f-ui);letter-spacing:.01em;border:1.5px solid var(--edge);background:var(--panel);color:var(--ink);padding:12px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--edge);text-decoration:none;white-space:nowrap}
.btn:active:not([disabled]){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.cy{background:var(--cy);color:#032447;border-color:#032447}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.sm{padding:8px 11px;font-size:12.5px;box-shadow:2px 2px 0 var(--edge)}
.btn.wide{width:100%;padding:19px;font-size:16px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn .dot{width:9px;height:9px;background:#032447;display:inline-block}
.btn.connected .dot{background:var(--cy);outline:1.5px solid var(--edge)}
.chip{font:600 11px/1 var(--f-mono);letter-spacing:.03em;border:1.5px solid var(--edge);background:var(--panel);padding:7px 10px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cy);color:#032447;border-color:#032447}
.link{font:700 13px/1 var(--f-ui);border:0;background:none;padding:3px 0;border-bottom:3px solid var(--cy);cursor:pointer;text-decoration:none}

/* scope page */
.grid-hero{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
.col{display:grid;gap:16px;align-content:start;min-width:0}
label,.lbl{display:block;font:500 11px/1.2 var(--f-mono);color:var(--soft);letter-spacing:.05em;text-transform:uppercase;margin-bottom:5px}
.big{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.big b{font:700 104px/.85 var(--f-head);letter-spacing:-.02em}
.big span{font:600 30px var(--f-head);color:var(--mute)}
.ticks{display:flex;gap:2px;height:16px;margin:6px 0 18px}
.ticks i{flex:1;background:var(--rule)} .ticks i.on{background:var(--hull)} .ticks i.last{background:var(--cy)}
.kv4{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--rule);margin-bottom:18px}
.kv4>div{padding:12px 14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kv4>div:nth-child(2n){border-right:0}
.kv4>div:nth-last-child(-n+2){border-bottom:0}
.kv4 b{font:500 17px/1.2 var(--f-mono)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);align-items:center}
.hero .ph{grid-column:1 / -1}
.hero-copy{padding:28px 10px 28px 30px}
h1{font:700 clamp(38px,4.4vw,64px)/.95 var(--f-head);text-transform:uppercase;letter-spacing:.005em;margin:0 0 16px}
h1 em{font-style:normal;color:var(--cy-ink)}
.hero-copy p{font-size:17px;max-width:46ch;color:var(--soft);margin:0 0 20px}
.legend{display:grid;gap:9px;font:500 12.5px var(--f-mono);color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:9px}
.legend i{width:11px;height:11px;display:inline-block}
.scopewrap{padding:20px 22px 20px 6px}
.scope{display:block;width:100%;height:auto;max-width:600px;margin:0 auto;border-radius:50%}
.scope .bgc{fill:#04223F}
.scope .ring{fill:none;stroke:#1E5F8E;stroke-width:.6}
.scope .ring.outer{stroke:#3FC9E6;stroke-width:1}
.scope .axis{stroke:#16496F;stroke-width:.4}
.scope .rl{font:600 4px var(--f-mono);fill:#8FC3E0;letter-spacing:.06em}
.scope .sweep{transform-origin:100px 100px;animation:sweep 7s linear infinite}
.scope .wedge{fill:#14DDF7;opacity:.16}
.scope .arm{stroke:#14DDF7;stroke-width:.8}
@keyframes sweep{to{transform:rotate(360deg)}}
.scope .b-live{fill:#14DDF7} .scope .b-dead{fill:#2F6E99} .scope .b-grad{fill:#FFFFFF;stroke:#14DDF7;stroke-width:.8} .scope .b-sig{fill:none;stroke:#FFFFFF;stroke-width:.6}
.scope .sub-w{fill:#FFFFFF} .scope .sub-c{fill:#14DDF7}
.scope rect{cursor:help}
.kv2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.kv2>div{padding:14px 18px}
.kv2>div+div{border-left:1px solid var(--rule)}
.kv2 b{font:700 24px/1.1 var(--f-head);text-transform:uppercase;overflow-wrap:anywhere}
.btnrow{display:flex;gap:12px;padding:18px;border-top:1px solid var(--rule)}
.btnrow .btn{flex:1}
.feed{display:grid;grid-template-columns:repeat(6,1fr)}
.feed>div{padding:18px 14px;text-align:center;border-right:1px solid var(--rule)}
.feed>div:last-child{border-right:0}
.feed .st{width:104px;height:auto;margin:0 auto 10px;display:block}
.feed b{display:block;font:700 20px var(--f-head)}
.feed p{margin:2px 0 6px;font-size:13px;color:var(--soft);line-height:1.35}
.ago{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.empty{padding:28px 20px;color:var(--soft);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.empty .mini{height:40px;width:70px}
.steps{display:grid;grid-template-columns:repeat(5,1fr)}
.steps>div{padding:20px 18px 24px;border-right:1px solid var(--rule)}
.steps>div:last-child{border-right:0}
.steps .pix{height:36px;width:auto;margin-bottom:14px} .steps .mini{height:36px;width:63px;margin-bottom:14px}
.steps .n{display:block;font:500 12px var(--f-mono);color:var(--cy-ink);margin-bottom:6px}
.steps h3{margin:0 0 6px;font:700 21px/1.1 var(--f-head);text-transform:uppercase}
.steps p{margin:0;color:var(--soft);font-size:14.5px}
.mt{margin-top:16px}

/* station svg */
.st .tierbar{fill:var(--rule)} .st .tieron{fill:var(--cy)}

/* deploy */
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;align-items:start}
.step h3{font:700 28px/1.05 var(--f-head);text-transform:uppercase;margin:0 0 8px}
.step p{margin:0 0 16px;color:var(--soft);max-width:68ch}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{text-align:left;border:1.5px solid var(--edge);background:var(--panel);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.opt[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--cy),4px 4px 0 var(--edge)}
.opt b{font:700 20px/1.05 var(--f-head);text-transform:uppercase;margin-top:8px}
.opt>span{color:var(--soft);font-size:14px}
.opt dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:12px 0 0;font:500 12px var(--f-mono)}
.opt dt{color:var(--mute)} .opt dd{margin:0;text-align:right}
.dg{width:24px;height:24px} .dg .on{fill:var(--cy)} .dg .off{fill:none;stroke:var(--mute);stroke-width:.4}
.note{font-size:13.5px;color:var(--soft);margin:14px 0 0;padding-left:12px;border-left:3px solid var(--cy)}
.youget{display:flex;gap:18px;align-items:center;padding:18px}
.youget .frame{border:1px solid var(--rule);padding:10px;width:150px;flex:none}
.youget .st{width:100%;height:auto;display:block}
.youget b{display:block;font:700 40px/1 var(--f-head)}
.youget span{color:var(--soft);font-size:14px}
.rows>div{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--rule)}
.rows>div:last-child{border-bottom:0}
.rows label{margin:0}
.rows b{font:500 15px var(--f-mono);text-align:right}

/* market + fleet + signals */
.filters{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:16px 18px}
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg>span{font:500 11px var(--f-mono);color:var(--mute);letter-spacing:.05em;text-transform:uppercase;margin-right:4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.card{border:0;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);background:none;padding:18px 12px 14px;cursor:pointer;text-align:center}
.card:hover{background:var(--stripe)}
.card .st{width:110px;height:auto;display:block;margin:0 auto 10px}
.card b{display:block;font:700 20px var(--f-head)}
.card .meta{font-size:12.5px;color:var(--soft)}
.you{display:inline-block;margin-left:5px;vertical-align:3px}
.more{padding:16px;text-align:center}
.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.lcard{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:16px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.lcard .st{width:110px;height:auto;display:block}
.lcard h4{margin:0 0 6px;font:700 24px/1 var(--f-head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lcard dl,.sig dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0 0 12px;font:500 11.5px var(--f-mono)}
.lcard dt,.sig dt{color:var(--mute)} .lcard dd,.sig dd{margin:0;text-align:right}
.lcard .btn{width:100%;white-space:normal;line-height:1.25;text-align:center}
.aucs{display:grid;grid-template-columns:minmax(0,1fr)}
.auc{padding:18px;border-right:1px solid var(--rule)}
.auc:last-child{border-right:0}
.auc .top2{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.auc .st{width:100px;height:auto}
.auc h4{margin:0;font:700 24px/1 var(--f-head)}
.bid{font:700 38px/1 var(--f-head);margin:2px 0 4px}
.bid small{font:500 13px var(--f-mono);color:var(--soft)}
.sigs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.sig{padding:16px 18px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;flex-direction:column}
.sig h4{margin:0 0 4px;font:700 26px/1 var(--f-head);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sig .desc{font-size:13.5px;color:var(--soft);margin:0 0 12px;min-height:2.6em}
.meter{display:flex;gap:2px;margin:0 0 4px}
.meter i{flex:1;height:10px;background:var(--rule)} .meter i.on{background:var(--cy)}
.sig .btns{margin-top:auto}

/* stations */
.kv5{display:grid;grid-template-columns:repeat(5,1fr)}
.kv5>div{padding:16px 18px;border-right:1px solid var(--rule)}
.kv5>div:last-child{border-right:0}
.kv5 b{display:block;font:500 21px/1.2 var(--f-mono)}
.kv5 b.g{color:var(--cy-ink)}
.actions{display:flex;flex-wrap:wrap;gap:12px;padding:18px;border-top:1px solid var(--rule)}
.strow{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1.15fr);border-top:1px solid var(--rule)}
.strow:first-of-type{border-top:0}
.strow>div{padding:18px}
.strow>div+div{border-left:1px solid var(--rule)}
.strow .st{width:100%;height:auto;display:block}
.strow h3{margin:0 0 8px;font:700 32px/1 var(--f-head);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:10px 0 14px}
.stats b{display:block;font:500 15px var(--f-mono)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--rule)}
.up:last-child{border-bottom:0}
.up b{font:700 14.5px var(--f-ui)}
.up small{grid-column:1;font-size:12.5px;color:var(--soft)}
.up .btn{grid-row:1 / span 2;grid-column:2}
.pips{display:inline-flex;gap:3px;margin-left:8px;vertical-align:1px}
.pips i{width:9px;height:9px;border:1px solid var(--edge);display:inline-block}
.pips i.on{background:var(--cy)}
.rentbox{border:1px solid var(--rule);padding:12px 14px;margin-bottom:12px;background:var(--stripe)}
.rentbox b{display:block;font:700 14.5px var(--f-ui);margin-bottom:2px}
.rentbox p{margin:0 0 10px;font-size:13px;color:var(--soft)}

/* how */
.split{padding:22px 22px 6px}
.squares{display:grid;grid-template-columns:repeat(50,1fr);gap:2px}
.squares i{aspect-ratio:1;display:block}
.sq-a{background:var(--cy)} .sq-b{background:var(--hull)} .sq-c{background:var(--mute);opacity:.5}
.splitkeys{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule);margin-top:18px}
.splitkeys>div{padding:16px 22px;border-right:1px solid var(--rule)}
.splitkeys>div:last-child{border-right:0}
.splitkeys .k{display:flex;gap:8px;align-items:center;font:700 15px var(--f-ui)}
.splitkeys .k i{width:13px;height:13px;display:inline-block}
.splitkeys b{display:block;font:700 56px/1 var(--f-head);margin:8px 0 4px}
.splitkeys p{margin:0;color:var(--soft);font-size:14px}
.fly{padding:10px 18px 18px}
.fly svg{display:block;width:100%;height:auto;max-width:900px;margin:0 auto}
.fly .ringe{fill:none;stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 5}
.fly .node rect{fill:var(--panel);stroke:var(--edge);stroke-width:1.5}
.fly .node.hot rect{fill:var(--cy);stroke:#032447}
.fly .node text{font:600 13px var(--f-ui);fill:var(--ink)}
.fly .node.hot text{fill:#032447}
.fly .arr{fill:var(--mute)}
.fly ol{display:none;margin:0;padding:0 0 0 22px}
.fly ol li{padding:6px 0;font-weight:600}
.pbody{padding:18px 22px}
.pbody p{margin:0 0 10px;color:var(--soft)}
.pbody p:last-child{margin:0}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--soft);text-align:left;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--stripe)}
td{padding:12px 14px;border-bottom:1px solid var(--rule);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-family:var(--f-mono)}
.tw{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}

/* docs */
.docs{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.toc ol{list-style:none;margin:0;padding:8px 18px 14px}
.toc li button{display:flex;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:10px 0;cursor:pointer;font-size:14.5px}
.toc li button span{font:500 11px var(--f-mono);color:var(--mute);padding-top:3px}
.doc{scroll-margin-top:16px}
.doc .body{padding:20px 24px 24px;max-width:80ch}
.doc .body p,.doc .body li{color:var(--soft)}
.doc .body strong{color:var(--ink)}
.doc .body h4{font:700 20px var(--f-head);text-transform:uppercase;margin:20px 0 6px}
.doc code{font:500 12.5px var(--f-mono);background:var(--stripe);padding:2px 5px}
.doc .tw{margin:12px 0;border:1px solid var(--rule)}
details{border-bottom:1px solid var(--rule)}
details summary{cursor:pointer;padding:13px 0;font-weight:700;list-style:none}
details summary::before{content:"▸";display:inline-block;width:18px;font-size:12px}
details[open] summary::before{content:"▾"}
details p{margin:0 0 14px 18px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(2,18,38,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{max-width:640px;width:100%;max-height:calc(100% - 32px);overflow:auto;box-shadow:6px 6px 0 var(--cy)}
.modal.wide{max-width:880px}
.x{margin-left:auto;background:none;border:0;font:700 18px var(--f-mono);cursor:pointer;padding:0 4px}
.wlist{display:grid;gap:10px;padding:18px}
.wopt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--edge);background:var(--panel);padding:12px 14px;cursor:pointer;text-align:left;font:700 15px var(--f-ui);text-decoration:none}
.wopt img,.wopt .ph-ico{width:28px;height:28px;flex:none}
.wopt .ph-ico{background:var(--mute)}
.wopt em{margin-left:auto;font:500 11px var(--f-mono);font-style:normal;color:var(--cy-ink);text-transform:uppercase;letter-spacing:.05em}
.wopt:hover{background:var(--stripe)}
.menu{position:absolute;right:18px;top:calc(100% - 4px);z-index:40;min-width:260px;box-shadow:4px 4px 0 var(--cy)}
.menu .rows>div{padding:12px 16px}
.mitems{display:grid;border-top:1px solid var(--rule)}
.mitems button,.mitems a{text-align:left;background:none;border:0;border-bottom:1px solid var(--rule);padding:12px 16px;cursor:pointer;font:600 14px var(--f-ui);text-decoration:none}
.mitems>*:last-child{border-bottom:0}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:60;max-width:min(380px,calc(100% - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;font:500 14px var(--f-ui);box-shadow:4px 4px 0 var(--cy)}
footer{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:space-between;padding:22px 2px 36px;font-size:13px;color:var(--soft)}

@media (max-width:1200px){
  .grid-hero{grid-template-columns:minmax(0,1fr)}
  .grid-hero>.hero{order:-1}
  .grid-2{grid-template-columns:minmax(0,1fr)}
  .opts{grid-template-columns:1fr 1fr}
  .feed{grid-template-columns:repeat(3,1fr)}
  .feed>div:nth-child(3n){border-right:0}
  .feed>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .steps{grid-template-columns:1fr 1fr}
  .steps>div{border-bottom:1px solid var(--rule)}
  .strow{grid-template-columns:150px minmax(0,1fr)}
  .strow>div:last-child{grid-column:1 / -1;border-left:0;border-top:1px solid var(--rule)}
  .docs{grid-template-columns:minmax(0,1fr)}
  .toc{position:static}
  .aucs{grid-template-columns:1fr}
  .auc{border-right:0;border-bottom:1px solid var(--rule)}
  .kv5{grid-template-columns:repeat(3,1fr)}
  .kv5>div:nth-child(3){border-right:0}
  .kv5>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
}
@media (max-width:1100px){
  .nav{grid-template-columns:1fr auto}
  .brand{border-right:0}
  .tabs{grid-column:1 / -1;grid-row:2;display:flex;border-top:1px solid var(--rule)}
  .tabs a{flex:1 0 92px}
}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero-copy{padding:24px 20px 6px}
  .scopewrap{padding:10px 16px 22px}
  .scope .rl{display:none}
}
@media (max-width:700px){
  .wrap{padding:10px}
  .opts,.opts.two,.two{grid-template-columns:1fr}
  .feed{grid-template-columns:1fr 1fr}
  .feed>div{border-bottom:1px solid var(--rule)}
  .feed>div:nth-child(2n){border-right:0}
  .feed>div:nth-child(3n){border-right:1px solid var(--rule)}
  .feed>div:nth-child(6n){border-right:0}
  .steps{grid-template-columns:1fr}
  .steps>div{border-right:0}
  .kv5{grid-template-columns:1fr 1fr}
  .kv5>div{border-right:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)}
  .kv5>div:nth-child(2n){border-right:0!important}
  .splitkeys{grid-template-columns:1fr}
  .splitkeys>div{border-right:0;border-bottom:1px solid var(--rule)}
  .squares{grid-template-columns:repeat(25,1fr)}
  .fly svg{display:none} .fly ol{display:block}
  .big b{font-size:84px}
  .kv2 b{font-size:21px}
  .brand{padding:10px 12px;gap:8px}
  .brand .mini{height:30px;width:52px}
  .brand b{font-size:22px}
  .walletcell{padding:10px 12px}
  .walletcell .btn{padding:9px 10px;font-size:12.5px;gap:7px}
  .strow{grid-template-columns:minmax(0,1fr)}
  .strow>div+div{border-left:0;border-top:1px solid var(--rule)}
  .strow .st{max-width:180px}
  .lists{grid-template-columns:minmax(0,1fr)}
  .lcard{grid-template-columns:90px minmax(0,1fr)}
  .lcard .st{width:90px}
}
@media (prefers-reduced-motion:reduce){
  .scope .sweep{animation:none}
  .btn:active:not([disabled]){transform:none}
}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="sprites"></defs></svg>

<div class="wrap">

  <main id="view" tabindex="-1"></main>

</div>

<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
"use strict";
/* ---------- logo pixel grid ---------- */
const SUB = [".................................ccc....................................", ".................................ccc....................................", "..............................wwwccc....................................", "..............................wwwccc....................................", "..............................ww........................................", "..............................ww........................................", "..............................ww..w.....................................", "............................wwww..w.....................................", "............................wwww..w.....................................", "............................ww....w.....................................", "........................wwwwwwwwwwwwww..................................", ".......................ww............ww.......................ccc.......", "......................www.............w.......................ccc.......", "......................www..cc..c..cc..w.........................ccc.....", ".....................www...cc..c..cc..ww........................ccc.....", "....wwwww.............................www.................ccc....cccc...", "....ww..ww............................www.................cccc....ccc...", "....ww..www........wwwwwwwwwwwwwwwwwwwwwwwwwww..............ccc...ccc...", "....ww....ww......wwwwwwwwwwwwwwwwwwwwwwwwwwwwwww............ccc...ccc..", "....wwccc..w.....wwwwwwwwwwwwwwwwwwwwwwwwwwww..www.....cc....ccc....cc..", "....wwccc..w....ww.........................ww..www.....ccc...ccc....cc..", "www.ww......wwwwww..........................w..wwwww....ccc...ccc....ccc", "www........wwww.............................w...wwwww...ccc....cc....ccc", "www.......wwwww....www......www......www....w...wwwww....ccc...cc....ccc", "wwww..wwwwwww......wccw....wcccw....wccw....w...wwcccw....cc...cc....ccc", "..ww..w...........wccccw..wcccccw..wccccw...w...wwcccw....cc...cc....ccc", "..ww..w...........wccccw..wcccccw..wccccw...w...wwcccw....cc...cc....ccc", "wwww..wwwwwww.....wwccww...wcccw....wccww...w...wwcccw....cc...cc....ccc", "wwww..wwwwwww.......ww......www......ww.....w...wwwww...ccc....cc....ccc", "www........wwww.............................w...wwwww...ccc....cc....ccc", "www.ww......www.............................w..wwwww....ccc..cccc....ccc", "....wwccc..w..wwww..........................w..www.....cc....ccc....cc..", "....wwccc.ww...wwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwwww......cc....ccc....cc..", "....ww...www.....wwwwwwwwwwwwwwwwwwwwwwwwwwwwww.............cccc..cccc..", "....ww..www.......wwwwwwwwwwwwwwwwwwwwwwwwwwww..............cc....ccc...", "....wwwwww................................................ccc....cccc...", ".....wwww.................................................ccc....cccc...", "................................................................ccc.....", "...............................................................cccc.....", "..............................................................ccc.......", "........................................................................"];

/* ---------- config ---------- */
const DAY = 86400, HOUR = 3600;
const CFG = {
  RPC: 'https://api.mainnet-beta.solana.com', // swap for your own RPC (Helius, Triton…) when you deploy
  X: 'https://x.com/SonarDotRent',
  SUPPLY: 1111, MINT0: 0.2, MINT1: 1.2,
  OPER: 0.60, BURN: 0.25, OPS: 0.15,
  RENT_OWNER: 0.90, RENT_BURN: 0.10, SIG_ROYALTY: 0.05,
  FRESH_H: 12, SIG_TTL: 24 * HOUR,
  PRICE0: 0.0000012, TOKEN_SUPPLY: 1e9,
  START_T: 2 * DAY + 9 * HOUR,
  OTHER_RATE: 4 / 1440
};
const TIERS = [
  { key: 'shallow', name: 'Shallow', unlock: 0, rate: 1/150, mu: Math.log(0.08), sd: 1.0, acc: 0, finds: 'Trending narratives', blurb: 'Listens near the surface: trending posts, busy pump.fun pages, memes spreading fast.', freq: 'High', spread: 'Narrow' },
  { key: 'deep', name: 'Deep', unlock: 25000, rate: 1/300, mu: Math.log(0.10), sd: 1.5, acc: 0, finds: 'Early on-chain activity', blurb: 'Tracks fresh wallets, new mints and early volume before the crowd notices.', freq: 'Medium', spread: 'Wide' },
  { key: 'abyssal', name: 'Abyssal', unlock: 80000, rate: 1/600, mu: Math.log(0.07), sd: 2.1, acc: 0, finds: 'Obscure signals', blurb: 'Reads strange, low-volume signals far from the mainstream.', freq: 'Low', spread: 'Extreme' },
  { key: 'quantum', name: 'Quantum', unlock: 180000, rate: 1/360, mu: Math.log(0.09), sd: 1.6, acc: 2, finds: 'Multi-model detection', blurb: 'Runs several AI models together and cross-checks every signal before it reports it.', freq: 'Medium', spread: 'Wide' }
];
const UP = {
  range:    { name: 'Scanning range', max: 5, cost: l => 5000 * l, eff: '+25% detection rate per level' },
  accuracy: { name: 'Detection accuracy', max: 5, cost: l => 6000 * l, eff: 'Sharper signal strength readings, +5% signal quality' },
  cap:      { name: 'Launch capacity', max: 3, cost: l => 20000 * l, eff: '+1 coin live at once' }
};
const DURS = [{ h: 1, name: '1 hour', off: 0 }, { h: 24, name: '1 day', off: 0.10 }, { h: 168, name: '1 week', off: 0.25 }];
const NARR = {
  shallow: { a: ['Capybara','Frog','Goose','Hamster','Penguin','Raccoon','Otter','Pigeon','Axolotl','Walrus','Lobster','Possum'], b: ['Council','Summer','Army','Season','Parade','Gym','Choir','Union','Club','Rally','Picnic','Mob'],
    s: ['Mentions up {n}% in 6 hours','In the top 20 on pump.fun','A meme format spreading across 3 apps','A sticker pack that went viral overnight'] },
  deep: { a: ['Fresh','Early','First','Quiet','Rising','Young','New','Swift','Bright','Silent','Sharp','Steady'], b: ['Mint','Wallet','Pool','Volume','Holder','Bid','Swap','Ledger','Block','Slot','Route','Vault'],
    s: ['{n} new wallets bought in the last hour','Early volume on a fresh pool','A cluster of first-time buyers','Smart-money wallets moving in'] },
  abyssal: { a: ['Dormant','Ghost','Orphan','Null','Lost','Prime','Midnight','Hollow','Drift','Echo','Deep','Dust'], b: ['Whale','Validator','Mint','Slot','Seed','Lamport','Memo','Key','Signal','Relic','Shard','Lode'],
    s: ['A wallet woke up after {n} days','An odd memo pattern in {n} transactions','A mint with strange metadata','Repeating transfers of {n} lamports'] },
  quantum: { a: ['Tidal','Prism','Vector','Lattice','Pulse','Helix','Nova','Cipher','Arc','Flux','Orbit','Wave'], b: ['Signal','Model','Grid','Index','Beacon','Array','Field','Core','Node','Loop','Mesh','Trace'],
    s: ['Confirmed by 3 models','Cross-checked on {n} data sources','Sentiment and wallets agree','Flagged by every model at once'] }
};

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n){ n = (n ^ 61) ^ (n >>> 16); n = n + (n << 3); n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return n >>> 0; }
function gauss(r = Math.random){ let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const pick = (arr, r = Math.random) => arr[Math.floor(r() * arr.length)];
const fmtSol = x => { x = +x || 0; return x >= 100 ? x.toFixed(1) : x >= 1 ? x.toFixed(2) : x >= 0.01 ? x.toFixed(3) : x > 0 ? x.toFixed(4) : '0'; };
const fmtTok = x => { x = +x || 0; if (x >= 1e9) return (x/1e9).toFixed(2) + 'B'; if (x >= 1e6) return (x/1e6).toFixed(x >= 1e7 ? 1 : 2) + 'M'; if (x >= 1e3) return (x/1e3).toFixed(x >= 1e4 ? 0 : 1) + 'k'; return Math.round(x) + ''; };
const pad2 = n => String(n).padStart(2, '0');
function ago(t){ const s = S.t - t; if (s < 60) return 'just now'; if (s < HOUR) return Math.floor(s / 60) + ' min ago'; if (s < DAY) return `${Math.floor(s / HOUR)} h ${Math.floor(s % HOUR / 60)} min ago`; return Math.floor(s / DAY) + ' d ago'; }
function left(t){ const s = Math.max(0, t - S.t); if (s < HOUR) return Math.ceil(s / 60) + ' min'; if (s < DAY) return `${Math.floor(s / HOUR)} h ${Math.floor(s % HOUR / 60)} min`; return `${Math.floor(s / DAY)} d ${Math.floor(s % DAY / HOUR)} h`; }
const short = a => a ? a.slice(0, 4) + '…' + a.slice(-4) : '';
const B58 = '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const randAddr = r => Array.from({ length: 44 }, () => B58[Math.floor(r() * 58)]).join('');
const mintPrice = n => CFG.MINT0 + (CFG.MINT1 - CFG.MINT0) * (Math.min(n, CFG.SUPPLY) - 1) / (CFG.SUPPLY - 1);
const price = () => CFG.PRICE0 * (1 + S.burned / CFG.TOKEN_SUPPLY * 40);
const r50 = x => Math.max(50, Math.round(x / 50) * 50);
const fresh = g => Math.exp(-(S.t - g.t) / (CFG.FRESH_H * HOUR));
const sigValue = g => r50(2500 * Math.exp(0.035 * (g.str - 50)) * fresh(g));

/* ---------- sprites ---------- */
function runs(test){
  let r = '';
  SUB.forEach((row, y) => { let x = 0; while (x < row.length) { if (test(row[x], x)) { const s = x; while (x < row.length && test(row[x], x)) x++; r += `<rect x="${s}" y="${y}" width="${x - s}" height="1"/>`; } else x++; } });
  return r;
}
document.getElementById('sprites').innerHTML = `<g id="subW">${runs(c => c === 'w')}</g><g id="subC">${runs((c, x) => c === 'c' && x < 54)}</g><g id="subV">${runs((c, x) => c === 'c' && x >= 54)}</g>`;
function pix(rows){
  const h = rows.length, w = rows[0].length; let r = '';
  rows.forEach((row, y) => [...row].forEach((c, x) => { if (c === '#') r += `<rect x="${x}" y="${y}" width="1" height="1"/>`; else if (c === 'c') r += `<rect class="c" x="${x}" y="${y}" width="1" height="1"/>`; }));
  return `<svg class="pix" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
}
const MINI = `<svg class="mini" viewBox="0 0 72 41" shape-rendering="crispEdges" aria-hidden="true"><use href="#subW" class="hull"/><use href="#subC" class="cyf"/><use href="#subV" class="cyf"/></svg>`;
const ICO = {
  scope: pix(['..#####..','.#.....#.','#...#...#','#..#c#..#','#.#ccc..#','#...#...#','.#.....#.','..#####..']),
  rent: pix(['.###.....','#...#....','#.c.#####','#...#.#.#','.###.....']),
  signal: pix(['....c....','...ccc...','..#.c.#..','.#..c..#.','#...c...#','....c....','....#....','...###...']),
  fleet: pix(['#.#.#.#.#','.........','#.#.#.#.#','.........','#.#.c.#.#','.........','#.#.#.#.#']),
  mine: pix(['.#######.','#.......#','#....####','#....#c##','#....####','#.......#','.#######.']),
  how: pix(['###...###','#c##.##c#','#..#.#..#','#.##.##.#','#..#.#..#','###.#.###']),
  docs: pix(['######..','#....##.','#.cc..##','#......#','#.####.#','#......#','#.####.#','########']),
  coin: pix(['..###..','.#ccc#.','#cc#cc#','#c###c#','#cc#cc#','.#ccc#.','..###..']),
  wave: pix(['c.....c..','.c.....c.','..c..c..c','..c..c..c','.c.....c.','c.....c..']),
  gavel: pix(['##.....','###....','.###...','..##.#.','...###.','....###','.....##'])
};
function tierGlyph(d){ return `<svg class="dg" viewBox="0 0 9 9" shape-rendering="crispEdges" aria-hidden="true">${[0,1,2,3].map(i => `<rect x=".5" y="${0.5 + i * 2.1}" width="8" height="1.4" class="${i <= d ? 'on' : 'off'}"/>`).join('')}</svg>`; }

/* ---------- state ---------- */
const KEY = 'sonar-state-v2', KEYW = 'sonar-wallet-v1';
let S, stById = new Map(), coinById = new Map();
function reindex(){ stById = new Map(S.st.map(e => [e.id, e])); coinById = new Map(S.coins.map(c => [c.id, c])); }
function feedPush(x){ x.t = S.t; S.feed.unshift(x); if (S.feed.length > 60) S.feed.length = 60; }
const hourly = e => e.rv / Math.max(6, Math.min(168, (S.t - e.t) / HOUR));
const fair = (e, share) => r50(0.75 * share * Math.max(hourly(e), 0.0015 * (1 + e.tier * 0.5) * e.cap) / price());
const inAuction = e => S.auc.some(a => a.st === e.id);
const opIsUser = e => e.rent ? e.rent.user : e.user;

function addOther(r){
  const n = S.st.length + 1; if (n > CFG.SUPPLY) return;
  const fee = mintPrice(n), x = r(), tier = x < 0.5 ? 0 : x < 0.8 ? 1 : x < 0.93 ? 2 : 3;
  const e = { id: n, owner: randAddr(r), tier, range: 1 + Math.min(4, Math.floor(r() * r() * 5)), accuracy: 1 + Math.min(4, Math.floor(r() * r() * 5)), cap: 1 + (r() < 0.3 ? 1 : 0) + (r() < 0.08 ? 1 : 0),
    mode: r() < 0.25 ? 'hold' : 'auto', live: 0, count: 0, det: 0, unclaimed: 0, rentUn: 0, own: 0, life: 0, rv: 0, j: [], user: false, list: null, rent: null, t: S.t };
  if (r() < 0.18) e.list = { share: pick([0.5, 0.6, 0.7, 0.8], r), k: 0.8 + r() * 0.6, price: 0 };
  let burnTok = TIERS[tier].unlock;
  for (const k of ['range','accuracy','cap']) for (let l = 1; l < e[k]; l++) burnTok += UP[k].cost(l);
  S.burnSol += fee * 0.5; S.burned += fee * 0.5 / price() + burnTok; S.ops += fee * 0.5;
  S.st.push(e); stById.set(e.id, e);
  if (e.list) e.list.price = r50(fair(e, e.list.share) * e.list.k);
}
function detect(e, r = Math.random){
  const tr = TIERS[e.tier], p = NARR[tr.key], a = pick(p.a, r), b = pick(p.b, r);
  const tick = (a.replace(/[^A-Za-z]/g, '').slice(0, 4) + b.replace(/[^A-Za-z]/g, '').slice(0, 1 + Math.floor(r() * 3))).toUpperCase();
  const n = [200 + Math.floor(r() * 900), 8 + Math.floor(r() * 60), 300 + Math.floor(r() * 1400), 4 + Math.floor(r() * 6)][e.tier];
  const F = Math.exp(tr.mu + tr.sd * gauss(r)) * (1 + 0.05 * (e.accuracy - 1));
  const z = (Math.log(F) - tr.mu) / tr.sd;
  const noise = 1.1 * Math.pow(0.78, e.accuracy - 1 + tr.acc);
  const str = Math.max(1, Math.min(99, Math.round(50 + 18 * (z + noise * gauss(r)))));
  return { id: S.nextSig++, tick, desc: pick(p.s, r).replace('{n}', n), tier: e.tier, F, str, t: S.t, src: e.id, user: false, owner: null, price: 0 };
}
function launch(e, g){
  const f = Math.exp(-(S.t - g.t) / (CFG.FRESH_H * HOUR));
  const F = g.F * f, L = Math.exp(Math.log(120) + 0.9 * gauss());
  const c = { id: S.nextCoin++, st: e.id, tier: g.tier, tick: g.tick, desc: g.desc, str: g.str, t0: S.t, F, L, fees: 0, alive: true, grad: false, gradAt: F > 5 ? F * 0.3 : -1 };
  S.coins.push(c); coinById.set(c.id, c);
  e.live++; e.count++; e.j.unshift(c.id);
  if (e.j.length > 64) { for (let i = e.j.length - 1; i >= 0; i--) { const cc = coinById.get(e.j[i]); if (!cc || !cc.alive) { e.j.splice(i, 1); break; } } if (e.j.length > 64) e.j.length = 64; }
  feedPush({ k: 'launch', st: e.id, tick: c.tick, tier: g.tier });
  S.ver++;
  if (opIsUser(e) && S.speed <= 60) toast(`Station #${e.id} launched $${c.tick}`);
}
function pay(c, f){
  c.fees += f;
  const e = stById.get(c.st);
  if (e) { const op = f * CFG.OPER, renter = e.rent ? op * e.rent.share : 0; e.rentUn += renter; e.unclaimed += op - renter; e.own += op - renter; e.life += op; e.rv += op; }
  S.burnSol += f * CFG.BURN; S.burned += f * CFG.BURN / price(); S.ops += f * CFG.OPS;
}
function startRent(e, who, isUser, hours, cost, share){

  S.burned += cost * CFG.RENT_BURN;
  if (e.user && !isUser) { S.wal.son += cost * CFG.RENT_OWNER; toast(`Station #${e.id} rented for ${hours === 1 ? '1 hour' : hours === 24 ? '1 day' : '1 week'}: +${fmtTok(cost * CFG.RENT_OWNER)} $SONAR`); }

}
function endRent(e){

}
function spawnAuction(){
  const pool = S.st.filter(e => !e.user && !e.rent && !e.list && !inAuction(e)).sort((a, b) => hourly(b) - hourly(a)).slice(0, 14);
  if (!pool.length) return;
  const e = pick(pool), start = r50(fair(e, 0.7) * 24 * 0.55);
  S.auc.push({ a: S.nextA++, st: e.id, bid: start, start, bidder: null, ends: S.t + (1.5 + Math.random() * 2.5) * HOUR, share: 0.7 });
  S.ver++;
}
function step(dm){
  const t0 = S.t; S.t += dm * 60;
  if (S.st.length < CFG.SUPPLY && Math.random() < dm * CFG.OTHER_RATE) { addOther(Math.random); S.ver++; }
  for (const e of S.st) {
    if (e.rent && S.t >= e.rent.until) endRent(e);
    if (e.list && !e.rent && !inAuction(e)) {
      const a = Math.max(0.05, Math.min(3, fair(e, e.list.share) / e.list.price));
      if (Math.random() < dm / 1100 * a) { const x = Math.random(), d = DURS[x < 0.5 ? 0 : x < 0.9 ? 1 : 2]; startRent(e, randAddr(Math.random), false, d.h, e.list.price * d.h * (1 - d.off), e.list.share); }
    }
    if (Math.random() < dm * TIERS[e.tier].rate * (1 + 0.25 * (e.range - 1))) {
      const g = detect(e); e.det++;
      if (e.mode === 'auto' && e.live < e.cap) launch(e, g);
      else if (opIsUser(e)) { g.user = true; g.owner = W.addr; S.sig.push(g); S.ver++; if (S.speed <= 60) toast(`Station #${e.id} detected $${g.tick}. Signal NFT added to your signals.`); }
      else if (Math.random() < 0.25) { g.owner = randAddr(Math.random); g.price = r50(sigValue(g) * (0.8 + Math.random() * 0.6)); S.sig.push(g); }
    }
  }
  for (const c of S.coins) {
    if (!c.alive) continue;
    const a0 = Math.max(0, (t0 - c.t0) / 60), a1 = Math.max(0, (S.t - c.t0) / 60);
    const f = c.F * (Math.exp(-a0 / c.L) - Math.exp(-a1 / c.L));
    if (f > 0) pay(c, f);
    if (!c.grad && c.gradAt > 0 && c.fees >= c.gradAt) { c.grad = true; S.ver++; }
    if (a1 > 3 * c.L) { c.alive = false; const e = stById.get(c.st); if (e) e.live = Math.max(0, e.live - 1); S.ver++; }
  }
  const decay = Math.exp(-dm * 60 / (7 * DAY));
  for (const e of S.st) e.rv *= decay;
  // signal market: buyers and expiry
  const keep = [];
  for (const g of S.sig) {
    if (S.t - g.t > CFG.SIG_TTL) { if (g.user) toast(`Signal $${g.tick} went stale and expired`); S.ver++; continue; }
    if (g.price > 0) {
      const a = Math.max(0.05, Math.min(3, sigValue(g) / g.price));
      if (Math.random() < dm / 260 * a) {
        S.burned += g.price * CFG.SIG_ROYALTY;
        if (g.user) { S.wal.son += g.price * (1 - CFG.SIG_ROYALTY); toast(`Signal $${g.tick} sold for ${fmtTok(g.price)} $SONAR`); }
        S.ver++; continue;
      }
    }
    keep.push(g);
  }
  S.sig = keep;
  const market = S.sig.filter(g => !g.user);
  if (market.length > 12) { const drop = new Set(market.slice(0, market.length - 12).map(g => g.id)); S.sig = S.sig.filter(g => !drop.has(g.id)); }
  for (const a of S.auc) {
    if (S.t < a.ends && Math.random() < dm / 40) {
      const nb = r50(Math.max(a.start, a.bid * (1.06 + Math.random() * 0.08)));
      if (nb <= fair(stById.get(a.st), a.share) * 24 * 1.25) { if (a.bidder === 'you') { S.wal.son += a.bid; toast(`You were outbid on station #${a.st}`); } a.bid = nb; a.bidder = randAddr(Math.random); S.ver++; }
    }
  }
  for (const a of S.auc.filter(a => S.t >= a.ends)) {
    const e = stById.get(a.st);
    if (a.bidder && e && !e.rent) { startRent(e, a.bidder === 'you' ? W.addr : a.bidder, a.bidder === 'you', 24, a.bid, a.share); if (a.bidder === 'you') toast(`You won the auction for station #${e.id}. It’s yours to run for 24 hours.`); }
    else if (a.bidder === 'you') S.wal.son += a.bid;
    S.auc = S.auc.filter(x => x !== a); S.ver++;
  }
  while (S.auc.length < 1) { const before = S.auc.length; spawnAuction(); if (S.auc.length === before) break; }
  if (Math.floor(S.t / HOUR) !== Math.floor(t0 / HOUR)) prune();
}
function advance(minutes){ while (minutes > 0) { const d = Math.min(5, minutes); step(d); minutes -= d; } }
function newWorld(){

}

        ${e.rent ? `<button class="btn sm" disabled>Rented, back in ${left(e.rent.until)}</button>` : mine ? `<button class="btn sm" data-go="stations">Manage listing</button>`
          : !W.addr ? `<button class="btn sm" data-act="wallet">Connect wallet</button>`

      </div></div>`; }).join('')}</div>` : `<div class="empty">${MINI}<span>No stations listed at this tier.</span></div>`}
  </section>`;
}

function meter(str){ const on = Math.round(str / 10); return `<div class="meter" aria-label="Strength ${str} of 99">${Array.from({ length: 10 }, (_, i) => `<i class="${i < on ? 'on' : ''}"></i>`).join('')}</div>`; }
function sigCard(g, mine){

      ? `<button class="btn sm cy" data-act="sigLaunch" data-g="${g.id}" ${fs ? '' : 'disabled title="No station with free launch capacity"'}>${fs ? 'Launch via #' + fs.id : 'No free station'}</button>${g.price ? `<button class="btn sm" data-act="sigUnlist" data-g="${g.id}">Unlist</button>` : `<button class="btn sm" data-act="sigListOpen" data-g="${g.id}">Sell</button>`}`
      : !W.addr ? `<button class="btn sm" data-act="wallet">Connect wallet</button>` : `<button class="btn sm cy" data-act="sigBuy" data-g="${g.id}" ${S.wal.son < g.price ? 'disabled' : ''}>Buy · ${fmtTok(g.price)}</button>`}</div>

}

    <button class="btn sm" data-act="upgrade" data-id="${e.id}" data-k="${k}" ${max || S.wal.son < cost ? 'disabled' : ''}>${max ? 'Maxed' : 'Upgrade · ' + fmtTok(cost)}</button></div>`;
}

    case 'sigListOpen': SL.id = 0; sigListModal(a.dataset.g); break;
    case 'slMult': SL.mult = +a.dataset.v; sigListModal(SL.id); break;
    case 'sigListSave': { const g = S.sig.find(x => x.id === +a.dataset.g); if (!mySig(g)) break; g.price = +a.dataset.p; closeModal(); toast(`Signal $${g.tick} listed for ${fmtTok(g.price)} $SONAR`); after(); break; }
    case 'sigUnlist': { const g = S.sig.find(x => x.id === +a.dataset.g); if (!mySig(g)) break; g.price = 0; toast(`Signal $${g.tick} unlisted`); after(); break; }
    case 'docjump': { const el = document.getElementById('doc-' + a.dataset.id); el && el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); break; }
  }
  if (act !== 'wallet' && !a.closest('#walletMenu')) $('#walletMenu').hidden = true;
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('#overlay').innerHTML) closeModal(); $('#walletMenu').hidden = true; } });
window.addEventListener('hashchange', route);

/* ---------- boot ---------- */
load();
S.speed = 60;
route();
paintWallet();
setTimeout(eagerConnect, 500);
let lastTick = performance.now(), lastSave = 0;
setInterval(() => {
  const now = performance.now(), dt = Math.min(2, (now - lastTick) / 1000); lastTick = now;
  if (S.speed > 0) advance(S.speed * dt / 60);
  updateLive(); render(false);
  if (now - lastSave > 5000) { save(); lastSave = now; }
}, 250);
window.addEventListener('pagehide', save);
</script>
</body>
